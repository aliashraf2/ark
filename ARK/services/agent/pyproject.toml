[project]
name = "ark-agent"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "csp-sdk",
    "anthropic>=0.90.0",
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
    "uvicorn[standard]>=0.54.0",
    "elevenlabs>=2.77.0",
]

[tool.uv.sources]
csp-sdk = { git = "https://github.com/ldbtech/capability-synthesis-protocol", rev = "3fe6e7d20d00d8c49c1787db8fb1e5810bb4c349" }

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
