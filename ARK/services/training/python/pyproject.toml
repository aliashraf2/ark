[project]
name = "ark-gym"
version = "0.1.0"
description = "Gymnasium adapter for ARK's Rapier rover simulation over a persistent Node.js bridge."
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=0.29",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ark_gym"]

[tool.pytest.ini_options]
testpaths = ["tests"]
