#cloud-config
# No API keys, login passwords, or application secrets belong in user-data.
package_update: true
packages:
  - ca-certificates
  - curl
  - python3-bcrypt
  - rsync
  - unattended-upgrades
ssh_pwauth: false
disable_root: false
write_files:
  - path: /etc/ssh/sshd_config.d/60-ark.conf
    permissions: '0644'
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin prohibit-password
  - path: /usr/local/sbin/ark-install-docker
    permissions: '0700'
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      install -m 0755 -d /etc/apt/keyrings
      curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
      chmod a+r /etc/apt/keyrings/docker.asc
      . /etc/os-release
      printf 'deb [arch=%s signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu %s stable\n' "$(dpkg --print-architecture)" "$VERSION_CODENAME" > /etc/apt/sources.list.d/docker.list
      apt-get update
      DEBIAN_FRONTEND=noninteractive apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
      systemctl enable --now docker
      mkdir -p /opt/ark/releases /opt/ark/shared/agent
      chown 10001:10001 /opt/ark/shared/agent
      chmod 0700 /opt/ark/shared /opt/ark/shared/agent
      systemctl reload ssh
runcmd:
  - /usr/local/sbin/ark-install-docker
